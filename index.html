<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PubMed RAG</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- FontAwesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            brand: { 400: '#60a5fa', 500: '#3b82f6', 600: '#2563eb' }
          }
        }
      }
    }
  </script>

  <style>
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }

    /* Abstract Expansion Logic */
    .abstract-content {
      max-height: 4.5rem; /* ~3 lines */
      overflow: hidden;
      transition: max-height 0.3s ease-in-out;
    }
    .abstract-content.expanded {
      max-height: 1000px;
    }
    .fade-out-bottom {
      mask-image: linear-gradient(to bottom, black 50%, transparent 100%);
      -webkit-mask-image: linear-gradient(to bottom, black 50%, transparent 100%);
    }
    .expanded.fade-out-bottom {
      mask-image: none;
      -webkit-mask-image: none;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-300 min-h-screen selection:bg-brand-500/30">

  <main class="max-w-4xl mx-auto px-4 py-12 sm:px-6 lg:px-8 flex flex-col gap-8">
    
    <!-- Header -->
    <header class="text-center space-y-3">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-brand-500/10 text-brand-400 mb-2 ring-1 ring-brand-500/20">
        <i class="fa-solid fa-dna text-3xl"></i>
      </div>
      <h1 class="text-3xl sm:text-4xl font-bold text-white tracking-tight">PubMed <span class="text-transparent bg-clip-text bg-gradient-to-r from-brand-400 to-indigo-400">RAG</span></h1>
      <p class="text-slate-400 font-medium">Semantic search & re-ranking across medical literature</p>
    </header>

    <!-- Search Section -->
    <section class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl shadow-black/50">
      <div class="flex flex-col gap-5">
        
        <!-- Main Input -->
        <div class="relative flex items-center w-full group">
          <i class="fa-solid fa-magnifying-glass absolute left-4 text-slate-500 group-focus-within:text-brand-500 transition-colors"></i>
          <input
            type="text"
            id="queryInput"
            class="w-full bg-slate-950 border border-slate-700 text-white rounded-xl py-3.5 pl-11 pr-[140px] focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition-all placeholder:text-slate-600"
            placeholder="Search literature (Press '/' to focus)..."
            autofocus
            oninput="toggleClearBtn()"
          />
          
          <!-- Quick actions inside input -->
          <div class="absolute right-2 top-2 bottom-2 flex items-center gap-2">
            <button 
              id="clearBtn" 
              onclick="clearInput()"
              class="hidden text-slate-500 hover:text-slate-300 p-2 rounded-lg transition-colors"
              title="Clear input (Esc)">
              <i class="fa-solid fa-xmark"></i>
            </button>
            <button 
              id="searchBtn" 
              onclick="doSearch()"
              class="bg-brand-600 hover:bg-brand-500 text-white font-medium rounded-lg px-5 h-full transition-colors flex items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
              <span>Search</span>
            </button>
          </div>
        </div>

        <!-- Filters & Suggestions -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 text-sm">
          <div class="flex flex-wrap items-center gap-4">
            <div class="flex items-center gap-2 bg-slate-950/50 border border-slate-800 rounded-lg px-3 py-2">
              <i class="fa-solid fa-filter text-slate-500"></i>
              <select id="domain" class="bg-transparent text-slate-300 outline-none cursor-pointer">
                <option value="">All Domains</option>
                <option value="cardiology">Cardiology</option>
                <option value="oncology">Oncology</option>
                <option value="neurology">Neurology</option>
                <option value="infectious diseases">Infectious Diseases</option>
                <option value="endocrinology">Endocrinology</option>
                <option value="pulmonology">Pulmonology</option>
                <option value="gastroenterology">Gastroenterology</option>
              </select>
            </div>

            <div class="flex items-center gap-2 bg-slate-950/50 border border-slate-800 rounded-lg px-3 py-2">
              <label for="retmax" class="text-slate-400">Pool Size:</label>
              <input type="number" id="retmax" value="20" min="5" max="100" class="bg-transparent text-white w-12 outline-none" />
            </div>

            <div class="flex items-center gap-2 bg-slate-950/50 border border-slate-800 rounded-lg px-3 py-2">
              <label for="topk" class="text-slate-400">Top K:</label>
              <input type="number" id="topk" value="5" min="1" max="20" class="bg-transparent text-white w-10 outline-none" />
            </div>
          </div>
        </div>

        <!-- Suggested Queries for Demo -->
        <div class="pt-4 border-t border-slate-800/60 flex flex-wrap items-center gap-2 text-xs">
          <span class="text-slate-500 font-medium mr-1"><i class="fa-regular fa-lightbulb text-amber-500 mr-1"></i> Try:</span>
          <button onclick="setQuery('SGLT2 inhibitors and heart failure hospitalization mortality', 'cardiology')" class="bg-slate-800/50 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-full transition-colors border border-slate-700/50">SGLT2 & Heart Failure</button>
          <button onclick="setQuery('PD-1 checkpoint inhibitors in non-small cell lung cancer', 'oncology')" class="bg-slate-800/50 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-full transition-colors border border-slate-700/50">PD-1 in Lung Cancer</button>
          <button onclick="setQuery('neurological symptoms and brain fog in long covid', 'neurology')" class="bg-slate-800/50 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-full transition-colors border border-slate-700/50">Long COVID Neuro</button>
        </div>

      </div>
    </section>

    <!-- Status / Meta -->
    <div id="statusContainer" class="hidden flex items-center justify-between text-sm px-2">
      <div id="statusText" class="text-slate-400 flex items-center gap-2"></div>
      <div id="statusTime" class="text-slate-500 font-mono"></div>
    </div>

    <!-- Results Area -->
    <section id="results" class="flex flex-col gap-4"></section>

  </main>

  <script>
    // Focus input on '/' keypress
    document.addEventListener('keydown', (e) => {
      if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
        e.preventDefault();
        document.getElementById('queryInput').focus();
      }
    });

    const queryInput = document.getElementById('queryInput');
    const clearBtn = document.getElementById('clearBtn');

    // Submit on Enter, Clear on Esc
    queryInput.addEventListener('keydown', e => { 
      if (e.key === 'Enter') doSearch(); 
      if (e.key === 'Escape') clearInput();
    });

    function toggleClearBtn() {
      clearBtn.style.display = queryInput.value.length > 0 ? 'block' : 'none';
    }

    function clearInput() {
      queryInput.value = '';
      toggleClearBtn();
      queryInput.focus();
    }

    function setQuery(text, domainValue = '') {
      queryInput.value = text;
      document.getElementById('domain').value = domainValue;
      toggleClearBtn();
      doSearch();
    }

    // Fallback copy function for safe iframe execution
    function copyToClipboard(text, btnElement) {
      const textArea = document.createElement("textarea");
      textArea.value = text;
      document.body.appendChild(textArea);
      textArea.select();
      
      try {
        document.execCommand('copy');
        const originalHTML = btnElement.innerHTML;
        btnElement.innerHTML = '<i class="fa-solid fa-check text-emerald-500"></i> Copied!';
        btnElement.classList.add('text-emerald-400');
        setTimeout(() => {
          btnElement.innerHTML = originalHTML;
          btnElement.classList.remove('text-emerald-400');
        }, 2000);
      } catch (err) {
        console.error('Failed to copy', err);
      }
      document.body.removeChild(textArea);
    }

    async function doSearch() {
      const question = queryInput.value.trim();
      if (!question) {
        queryInput.focus();
        return;
      }

      const btn = document.getElementById('searchBtn');
      const statusText = document.getElementById('statusText');
      const statusTime = document.getElementById('statusTime');
      const statusContainer = document.getElementById('statusContainer');
      const results = document.getElementById('results');

      // UI Loading State
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i>';
      statusContainer.classList.remove('hidden');
      statusText.innerHTML = '<span class="text-brand-400 animate-pulse">Querying PubMed & generating embeddings...</span>';
      statusTime.textContent = '';
      
      showSkeletonLoaders(results);

      const payload = {
        question,
        domain: document.getElementById('domain').value,
        retmax: parseInt(document.getElementById('retmax').value),
        top_k: parseInt(document.getElementById('topk').value),
      };

      try {
        const t0 = Date.now();
        const res = await fetch('/query', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        if (res.status === 503) {
          throw new Error('Model is loading. Please wait a few seconds and try again.');
        }
        if (!res.ok) {
          const err = await res.text();
          throw new Error(`Server error: ${err}`);
        }

        const data = await res.json();
        const elapsed = ((Date.now() - t0) / 1000).toFixed(2);

        statusText.innerHTML = `<i class="fa-solid fa-check text-emerald-500"></i> Found ${data.n_candidates} candidates, showing top ${data.results.length}`;
        statusTime.textContent = `${elapsed}s`;

        renderResults(data.results, results);

      } catch (err) {
        statusText.innerHTML = `<i class="fa-solid fa-circle-exclamation text-red-500"></i> <span class="text-red-400">${esc(err.message)}</span>`;
        results.innerHTML = '';
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span>Search</span>';
      }
    }

    function showSkeletonLoaders(container) {
      const skeletonHTML = Array(3).fill(`
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-sm animate-pulse">
          <div class="flex justify-between items-start mb-4">
            <div class="h-5 bg-slate-800 rounded w-1/4"></div>
            <div class="h-6 bg-slate-800 rounded-full w-16"></div>
          </div>
          <div class="h-7 bg-slate-800 rounded w-3/4 mb-3"></div>
          <div class="h-4 bg-slate-800 rounded w-1/3 mb-6"></div>
          <div class="space-y-2">
            <div class="h-4 bg-slate-800 rounded w-full"></div>
            <div class="h-4 bg-slate-800 rounded w-full"></div>
            <div class="h-4 bg-slate-800 rounded w-5/6"></div>
          </div>
        </div>
      `).join('');
      container.innerHTML = skeletonHTML;
    }

    function renderResults(articles, container) {
      if (!articles.length) {
        container.innerHTML = `
          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-10 text-center">
            <i class="fa-regular fa-folder-open text-4xl text-slate-600 mb-3"></i>
            <h3 class="text-lg font-medium text-slate-300">No articles found</h3>
            <p class="text-slate-500 mt-1">Try adjusting your search terms or expanding your domain filter.</p>
          </div>`;
        return;
      }

      const currentYear = new Date().getFullYear();
      container.innerHTML = '';

      articles.forEach((a, i) => {
        const score = a.combined_score ?? a.semantic_score ?? 0;
        const scorePct = (score * 100).toFixed(1);
        const semScorePct = (a.semantic_score * 100).toFixed(1);
        
        const pubYear = parseInt(a.year) || 0;
        const isRecent = pubYear > 0 && (currentYear - pubYear) < 5;

        const card = document.createElement('div');
        card.className = 'bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-sm hover:shadow-md hover:border-slate-700 transition-all group';
        
        // Build Meta String
        const metaParts = [];
        if (a.journal) metaParts.push(`<i class="fa-regular fa-newspaper text-slate-500 mr-1.5"></i>${esc(a.journal)}`);
        if (a.year) metaParts.push(`<i class="fa-regular fa-calendar text-slate-500 mr-1.5"></i>${esc(a.year)}`);
        
        card.innerHTML = `
          <!-- Header: Rank & Badges -->
          <div class="flex flex-wrap justify-between items-start gap-4 mb-3">
            <span class="text-xs font-bold uppercase tracking-wider text-brand-500 bg-brand-500/10 px-2.5 py-1 rounded-md">
              Rank #${i + 1}
            </span>
            <div class="flex gap-2">
              ${isRecent ? `<span class="inline-flex items-center gap-1 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2.5 py-1 rounded-full text-xs font-medium"><i class="fa-regular fa-clock"></i> Recent</span>` : ''}
              
              <div class="relative group/tooltip flex items-center gap-2 bg-indigo-500/10 border border-indigo-500/20 px-2.5 py-1 rounded-full text-xs font-medium text-indigo-300 cursor-help">
                <i class="fa-solid fa-chart-line"></i> ${scorePct}% Match
                <!-- Tooltip -->
                <div class="absolute bottom-full right-0 mb-2 w-48 p-2 bg-slate-800 border border-slate-700 rounded-lg shadow-xl text-slate-300 text-[11px] opacity-0 group-hover/tooltip:opacity-100 transition-opacity pointer-events-none z-10">
                  <div class="flex justify-between mb-1"><span>Semantic Match:</span> <span class="text-white">${semScorePct}%</span></div>
                  <div class="flex justify-between"><span>Recency Bonus:</span> <span class="text-white">+${(a.recency_bonus * 100).toFixed(1)}%</span></div>
                </div>
              </div>
            </div>
          </div>

          <!-- Title -->
          <h2 class="text-lg font-semibold text-slate-100 leading-snug mb-2 group-hover:text-brand-400 transition-colors">
            <a href="${esc(a.pubmed_url)}" target="_blank" class="hover:underline decoration-brand-500/30 underline-offset-4">${esc(a.title)}</a>
          </h2>
          
          <!-- Meta -->
          <div class="flex flex-wrap items-center gap-4 text-sm text-slate-400 mb-4 font-medium">
            ${metaParts.join('<span class="text-slate-700">•</span>')}
          </div>

          <!-- Score Visual Bar -->
          <div class="w-full bg-slate-800 rounded-full h-1.5 mb-4 overflow-hidden">
            <div class="bg-gradient-to-r from-brand-600 to-indigo-500 h-1.5 rounded-full" style="width: ${scorePct}%"></div>
          </div>

          <!-- Abstract -->
          <div class="relative mb-4">
            <p id="abs-${i}" class="text-sm text-slate-400 leading-relaxed abstract-content fade-out-bottom">
              ${esc(a.abstract)}
            </p>
            <button id="btn-${i}" onclick="toggleAbstract(${i})" class="text-xs font-medium text-brand-400 hover:text-brand-300 mt-2 flex items-center gap-1 transition-colors">
              <span>Read Full Abstract</span> <i class="fa-solid fa-chevron-down text-[10px] mt-0.5"></i>
            </button>
          </div>

          <!-- Action Links -->
          <div class="flex flex-wrap gap-3 mt-5 pt-4 border-t border-slate-800">
            <a href="${esc(a.pubmed_url)}" target="_blank" class="text-sm font-medium text-white bg-slate-800 hover:bg-slate-700 border border-slate-700 px-4 py-2 rounded-lg transition-colors flex items-center gap-2">
              <i class="fa-solid fa-arrow-up-right-from-square text-xs text-slate-400"></i> View on PubMed
            </a>
            ${a.doi ? `
              <a href="https://doi.org/${esc(a.doi)}" target="_blank" class="text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800 px-4 py-2 rounded-lg transition-colors flex items-center gap-2">
                <i class="fa-solid fa-link text-xs"></i> DOI
              </a>
            ` : ''}
            
            <button onclick="copyToClipboard('${esc(a.pubmed_url)}', this)" class="text-sm font-medium text-slate-400 hover:text-white ml-auto px-3 py-2 rounded-lg transition-colors flex items-center gap-1.5 cursor-pointer">
              <i class="fa-regular fa-copy"></i> Copy Link
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function toggleAbstract(i) {
      const p = document.getElementById(`abs-${i}`);
      const btn = document.getElementById(`btn-${i}`);
      const isExpanded = p.classList.toggle('expanded');
      
      if (isExpanded) {
        btn.innerHTML = '<span>Show Less</span> <i class="fa-solid fa-chevron-up text-[10px] mt-0.5"></i>';
      } else {
        btn.innerHTML = '<span>Read Full Abstract</span> <i class="fa-solid fa-chevron-down text-[10px] mt-0.5"></i>';
      }
    }

    function esc(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
